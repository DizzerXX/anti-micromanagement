<div style="position: absolute; left: 64px; top: 56px; font-size: 24px; line-height: 32px; font-weight: 600; color: #1C1B18">Task status</div>
<div style="position: absolute; left: 64px; top: 92px; width: 980px; color: #57554E">New tasks start in To do. Each arrow writes one row to task_events. Any status can also log a progress note (same status, note required).</div>

<div style="position: absolute; left: 64px; top: 200px; width: 200px; height: 64px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #ECEAE3; border: 1px solid #C9C5B8; border-radius: 10px; color: #57554E; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg><span>To do</span></div>

<div style="position: absolute; left: 456px; top: 456px; width: 200px; height: 64px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #FBEBD9; border: 1px solid #E8B98A; border-radius: 10px; color: #9A4A00; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.7 5.7l12.6 12.6"></path></svg><span>Blocked</span></div>
